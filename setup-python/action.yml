name: Python Setup Action
description: Setup action to capture Python Build Scans
author: Gradle team
inputs:
  develocity-url:
    description: 'Develocity server URL'
    required: true
  develocity-access-key:
    description: 'Develocity access key. Should be set to a secret containing the Develocity Access key'
    required: false
  develocity-token-expiry:
    description: 'Develocity short-lived access tokens expiry in hours (Default 2 hours)'
    required: false
  develocity-workload-identity:
    description: >-
      Whether to authenticate with a GitHub OIDC token exchanged for a Develocity access token instead of
      develocity-access-key. Requires develocity-url and the `id-token: write` job permission
    required: false
    default: 'false'
  develocity-workload-identity-audience:
    description: 'Audience of the GitHub OIDC token, which has to match the workload identity rule (Default develocity-url)'
    required: false
  develocity-injection-enabled:
    description: 'Whether to enable or not Develocity Python agent injection'
    required: false
    default: 'true'
  develocity-allow-untrusted-server:
    description: 'Whether to allow communicating with untrusted server. Sets DEVELOCITY_ALLOW_INSECURE_PROTOCOL for the agent'
    required: false
  develocity-python-agent-version:
    description: >-
      Develocity Python agent version (ignored when develocity-python-agent-url-override is set). The default is
      the version this release of the action was tested with
    required: false
    default: '0.10.1'
  develocity-python-agent-url-override:
    description: 'Override the URL to use to download the Develocity Python agent wheel'
    required: false
  develocity-python-agent-sha256:
    description: >-
      Expected SHA-256 of the agent wheel. Known for the default version; set it when changing the version or the URL
    required: false
  python-executable:
    description: 'Python interpreter the agent is installed into. It has to be the one that runs the instrumented tools'
    required: false
    default: 'python'
runs:
  using: node24
  main: ../dist/setup-python/main/index.js
