name: Docker Setup Action
description: Setup action to capture Docker Build Scans
author: Gradle team

inputs:
  develocity-url:
    description: 'Develocity server URL'
    required: true
  develocity-access-key:
    description: 'Develocity access key. Should be set to a secret containing the Develocity Access key'
    required: true
  develocity-token-expiry:
    description: 'Develocity short-lived access tokens expiry in hours (Default 2 hours)'
    required: false
  develocity-project-id:
    description: 'Develocity project identifier sent when requesting a scan token'
    required: false
  develocity-docker-agent-version:
    description: 'Develocity Docker agent version'
    required: false
    default: '0.9.0'
  develocity-docker-agent-url-override:
    description: 'Base URL the Develocity Docker agent is downloaded from'
    required: false
  capture-package-list:
    description: 'Whether to catalogue the packages contained in each built image'
    required: false
    default: 'true'
  buildx-builder:
    description: >-
      Name of the buildx builder to attach to. The agent attaches to whichever builder is current
      when it starts, so a job building on its own builder has to name it here
    required: false
  drain-timeout:
    description: 'Seconds to wait for the agent to publish every captured build before stopping it'
    required: false
    default: '300'
  shutdown-timeout:
    description: 'Seconds to wait for the agent to exit once it has been signalled'
    required: false
    default: '120'
  java-home-override:
    description: 'JDK 21 or later used to run the agent. Detected from the runner when not set'
    required: false

runs:
  using: node20
  main: ../dist/setup-docker/main/index.js
  post: ../dist/setup-docker/post/index.js
